# ================== 应用基础信息 ==================
spring:
  application:
    # 应用名称
    name: springboot-mybatis-quickstart

  # ================== 数据库连接配置 ==================
  datasource:
    # 数据库连接地址：jdbc:mysql://主机:端口/数据库名
    url: jdbc:mysql://localhost:3306/web01
    # 数据库驱动类名（MySQL 8 使用 com.mysql.cj.jdbc.Driver）
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 数据库用户名
    username: root
    # 数据库密码
    password: Su290219

# ================== MyBatis 配置 ==================
mybatis:
  # Mapper XML 映射文件的存放位置（resources/mapper 目录下的所有 xml）
  mapper-locations: classpath:mapper/*.xml
  configuration:
    # 将 SQL 日志输出到控制台，便于调试查看执行的 SQL 语句
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
